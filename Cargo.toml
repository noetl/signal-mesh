[package]
name = "signal-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/noetl/signal-mesh"
description = "Tiered A2A/ReAct agent mesh over an event log: device signals reduced through hierarchical reasoning agents to one number and one boolean"
readme = "README.md"
publish = false

[dependencies]
# EHDB is consumed as a LIBRARY, pinned to a released tag.
#
# ⚠ Pinned by `tag`, not `branch`. A branch dependency re-resolves on every
# fresh `cargo build` with no lockfile, so two checkouts of the same commit can
# compile against different ehdb source. The tag makes the dependency a fact
# about this commit rather than about when it was built.
#
# ⚠ History: this was briefly `rev = "a6791e96"`. M3's configuration surface
# (`read_consistency_from_env`, noetl/ehdb#368) merged to ehdb `main` after
# v0.3.1 and no tag then contained it; ehdb has no `semantic-release.yml` —
# only `ci.yml` — so its tags are cut by hand, and cutting one was not this
# repo's to do. The chain-store workstream has since released v0.4.0 and
# v0.4.1, both of which contain that commit, so the temporary rev-pin is
# retired in favour of the newest of them.
#
# ⚠⚠ v0.4.1 is an ANNOTATED tag: `git rev-parse v0.4.1` gives the tag object
# (dc0e142), not the commit (1d0a85e). Cargo.lock records the commit, and that
# is the one to compare against — reading the tag object and concluding the
# lock resolved something else is an easy, confident, wrong answer.
#
# The ehdb crates are not published to crates.io, so a git dependency is the
# only option; `version` is therefore omitted deliberately.
ehdb-core = { git = "https://github.com/noetl/ehdb", tag = "v0.4.1" }
ehdb-l0 = { git = "https://github.com/noetl/ehdb", tag = "v0.4.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "signal-mesh-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "signal-mesh-serve"
path = "src/bin/serve.rs"
